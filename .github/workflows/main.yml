name: Deploy to Docker

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  build-and-deploy:
    runs-on: self-hosted  # Especifica que se ejecuta en un runner self-hosted

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3
      - name: Limpiar imágenes huérfanas (opcional)
        run: |
          docker system prune -a --volumes --force # Elimina imágenes sin uso para ahorrar espacio
      - name: Construir imagen con etiqueta latest
        run: |
          docker build -f DockerFile.vps -t esakifront:latest .

      - name: Eliminar contenedor antiguo
        run: |
          docker rm -f esakifront || true  # Fuerza eliminación si existe



      - name: Ejecutar nuevo contenedor
        run: |
          docker run -d \
            --name esakifront \
            -p 3000:3000 \
            --restart unless-stopped \
            esakifront:latest
